<!doctype html>
<!-- GitHub Pages SPA fallback: rewrite /EliteHuman/archive → /EliteHuman/ (client router takes over) -->
<script>
  // GitHub Pages SPA fallback: /EliteHuman/archive → /EliteHuman/#/archive (App router reads hash after load)
  const SEG = 'EliteHuman/';
  const l = window.location;
  const route = l.pathname.startsWith('/' + SEG) ? l.pathname.slice(SEG.length + 1) : '';
  if (route) l.replace(l.origin + '/' + SEG + '#/' + route + l.search);
  else l.replace(l.origin + '/' + SEG);
</script>
