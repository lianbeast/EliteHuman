<!doctype html>
<!-- GitHub Pages SPA fallback: a deep link like /EliteHuman/archive/ 404s before
     the bundle loads, so the original path is stashed and replayed as a hash the
     router adopts, then strips. -->
<script>
  const SEG = 'EliteHuman/';
  const p = location.pathname;
  if (p.indexOf(SEG) !== 0 || p === '/' + SEG || p === '/' + SEG + 'index.html') {
    // Not ours — let the real 404 stand.
  } else {
    let rel = p.slice(SEG.length);
    if (rel.charAt(0) !== '/') rel = '/' + rel;
    location.replace(
      location.origin +
        '/' +
        SEG +
        'index.html#' +
        rel +
        location.search
    );
  }
</script>
