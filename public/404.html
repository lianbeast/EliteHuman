<!doctype html>
<!-- GitHub Pages SPA fallback: rewrite /EliteHuman/archive → /EliteHuman/ (client router takes over) -->
<script>
  const SEG = 'EliteHuman/';
  const l = window.location;
  if (l.pathname.startsWith('/' + SEG) && l.pathname !== '/' + SEG) {
    l.replace(l.origin + '/' + SEG + l.search + l.hash);
  } else {
    l.replace(l.origin + '/' + SEG);
  }
</script>
